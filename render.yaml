# Render Blueprint - deploys the Stock Tracker as an always-on web service.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: stock-tracker
    runtime: python
    plan: free
    healthCheckPath: /api/health
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 server.py"
    envVars:
      # Your Finnhub API key. sync:false means Render will NOT read it from this
      # file - you paste it in the dashboard (Environment tab) as a secret.
      - key: FINNHUB_API_KEY
        sync: false
      # Free Twelve Data key (https://twelvedata.com) powers the growth chart's
      # historical prices. Paste it in the dashboard as a secret. Without it the
      # chart shows a "add a key" message; quotes/net worth still work.
      - key: TWELVEDATA_API_KEY
        sync: false
      # Reuse quotes for 60s so ~60 tickers stay within Finnhub's free 60/min.
      # Combined with last-known-good fallback, this keeps totals stable.
      - key: CACHE_TTL
        value: "60"
      - key: MAX_WORKERS
        value: "6"
      # How many of your largest holdings to pull history for. Kept at 6 so a
      # single fetch stays under Twelve Data's free ~8-calls/min cap; the rest of
      # the portfolio is extrapolated from this basket.
      - key: HISTORY_MAX_SYMBOLS
        value: "6"
      # History is daily data and the app also caches it on-device for 2 days,
      # so refetches are rare (keeps us well within the free daily quota).
      - key: HISTORY_TTL
        value: "172800"
      - key: PYTHON_VERSION
        value: "3.12.5"
